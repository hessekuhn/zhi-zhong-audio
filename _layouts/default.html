<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">ZZ</span>
          <span class="brand-copy">
            <strong>{{ site.title }}</strong>
            <span>{{ site.tagline }}</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a class="{% if page.url == '/' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
          <a class="{% if page.url == '/projects/' %}is-active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>
          <a class="{% if page.url == '/publications/' %}is-active{% endif %}" href="{{ '/publications/' | relative_url }}">Publications</a>
        </nav>
      </header>

      <main class="site-main">
        <article class="content-panel">
          {{ content }}
        </article>
      </main>
    </div>
  </body>
</html>
